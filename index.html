<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>사장님도 퇴근합니다</title>

  <meta
    name="description"
    content="오늘도 장사하느라 고생하셨습니다. 사장님들의 현실 장사 이야기와 웃픈 경험을 나누는 커뮤니티입니다."
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ==========================================
       HEADER
  =========================================== -->

  <header class="site-header">

    <div class="header-inner">

      <div
        class="logo"
        onclick="showHome()"
      >
        🌙 사장님도 퇴근합니다
      </div>

      <div class="header-actions">

        <button
          id="loginButton"
          class="header-button"
          onclick="openLoginModal()"
        >
          로그인
        </button>

        <button
          id="signupButton"
          class="header-button primary"
          onclick="openSignupModal()"
        >
          회원가입
        </button>

        <button
          id="logoutButton"
          class="header-button"
          onclick="logout()"
          style="display:none;"
        >
          로그아웃
        </button>

      </div>

    </div>

  </header>


  <!-- ==========================================
       MAIN
  =========================================== -->

  <main class="main-container">

    <section class="hero">

      <div class="hero-icon">
        🌙
      </div>

      <h1>
        사장님도<br>
        퇴근합니다.
      </h1>

      <p>
        오늘도 장사하느라 고생하셨습니다.
      </p>

      <p class="hero-sub">
        웃픈 장사 이야기부터<br>
        아무에게도 말 못 했던 사장님들의 속마음까지.
      </p>

      <div class="hero-buttons">

        <button
          class="big-button primary"
          onclick="openSignupModal()"
        >
          사장님으로 시작하기
        </button>

        <button
          class="big-button"
          onclick="openLoginModal()"
        >
          로그인
        </button>

      </div>

    </section>


    <!-- ==========================================
         CATEGORY
    =========================================== -->

    <section class="category-section">

      <h2>사장님들의 이야기</h2>

      <div class="category-grid">

        <button>🔥 오늘의 고충</button>
        <button>😂 웃픈 장사썰</button>
        <button>😭 사장님 하소연</button>
        <button>💡 장사 노하우</button>
        <button>❤️ 사장님 위로</button>
        <button>🗣️ 자유게시판</button>

      </div>

    </section>


    <!-- ==========================================
         LOGIN USER INFO
    =========================================== -->

    <section
      id="userInfo"
      class="user-info"
      style="display:none;"
    >

      <div class="user-info-title">
        👋 어서 오세요
      </div>

      <div id="userNickname">
        사장님
      </div>

      <div id="userBusinessType">
        업종
      </div>

    </section>

  </main>


  <!-- ==========================================
       SIGNUP MODAL
  =========================================== -->

  <div
    id="signupModal"
    class="modal"
    onclick="closeModalOutside(event, 'signupModal')"
  >

    <div class="modal-box">

      <button
        class="modal-close"
        onclick="closeModal('signupModal')"
      >
        ×
      </button>

      <h2>🌙 사장님 회원가입</h2>

      <p class="modal-description">
        사장님들의 이야기에 함께해 주세요.
      </p>


      <label>
        이메일
      </label>

      <input
        id="signupEmail"
        type="email"
        placeholder="example@email.com"
      >


      <label>
        비밀번호
      </label>

      <input
        id="signupPassword"
        type="password"
        placeholder="6자 이상"
      >


      <label>
        닉네임
      </label>

      <input
        id="signupNickname"
        type="text"
        maxlength="20"
        placeholder="예: 꽃집사장님"
      >


      <label>
        업종
      </label>

      <select id="signupBusinessType">

        <option value="">업종을 선택하세요</option>

        <option value="꽃집">🌸 꽃집</option>
        <option value="식당">🍚 식당</option>
        <option value="카페">☕ 카페</option>
        <option value="의류">👕 의류</option>
        <option value="미용">💇 미용</option>
        <option value="소매">🛍️ 소매</option>
        <option value="온라인">💻 온라인</option>
        <option value="서비스">🛠️ 서비스</option>
        <option value="기타">📦 기타</option>

      </select>


      <button
        class="modal-submit"
        onclick="signup()"
      >
        회원가입
      </button>


      <div
        id="signupMessage"
        class="form-message"
      ></div>


      <div class="modal-bottom">

        이미 회원이신가요?

        <button onclick="switchToLogin()">
          로그인
        </button>

      </div>

    </div>

  </div>


  <!-- ==========================================
       LOGIN MODAL
  =========================================== -->

  <div
    id="loginModal"
    class="modal"
    onclick="closeModalOutside(event, 'loginModal')"
  >

    <div class="modal-box">

      <button
        class="modal-close"
        onclick="closeModal('loginModal')"
      >
        ×
      </button>

      <h2>🌙 로그인</h2>

      <p class="modal-description">
        다시 만나서 반갑습니다, 사장님.
      </p>


      <label>
        이메일
      </label>

      <input
        id="loginEmail"
        type="email"
        placeholder="example@email.com"
      >


      <label>
        비밀번호
      </label>

      <input
        id="loginPassword"
        type="password"
        placeholder="비밀번호"
      >


      <button
        class="modal-submit"
        onclick="login()"
      >
        로그인
      </button>


      <div
        id="loginMessage"
        class="form-message"
      ></div>


      <div class="modal-bottom">

        아직 회원이 아니신가요?

        <button onclick="switchToSignup()">
          회원가입
        </button>

      </div>

    </div>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>

</body>
</html>
